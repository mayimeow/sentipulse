<style>
:root {
  --bg:#f6efe6; --panel:#ffffff; --panel2:#f3ebe1; --line:#e7dccf;
  --text:#3e2723; --muted:#8a7768; --accent:#6f4e37; --accent2:#c8793a;
  --brown-dark:#3e2723; --brown-mid:#5d4037; --cream:#f6efe6; --latte:#d7b99a;
  --pos:#5b8c5a; --neu:#b8a99a; --mix:#d9a441; --neg:#b5483a;
  --shadow:0 2px 10px rgba(62,39,35,.07);
  --serif:Georgia,"Times New Roman",serif;
}
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.45; }
body { background-image:radial-gradient(rgba(111,78,55,.07) 1px, transparent 1px); background-size:22px 22px; }
.app { max-width:1280px; margin:0 auto; padding:18px 18px 40px; }

/* Header banner */
.topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  background:linear-gradient(135deg,var(--brown-dark),var(--brown-mid)); border-radius:16px;
  padding:16px 22px; margin-bottom:14px; box-shadow:var(--shadow); color:var(--cream); }
.brand { display:flex; align-items:center; gap:14px; }
.logo { width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:rgba(246,239,230,.12); border:1px solid rgba(215,185,154,.5); }
.brand-name { font-family:var(--serif); font-size:26px; font-weight:700; letter-spacing:.5px; color:var(--cream); }
.brand-sub { color:var(--latte); font-size:13px; letter-spacing:.4px; }
.top-actions { display:flex; align-items:center; gap:14px; }
.updated { color:var(--latte); font-size:12px; display:flex; align-items:center; gap:7px; }
.dot { width:9px; height:9px; border-radius:50%; background:#8fc98e; display:inline-block; }
.dot.busy { background:var(--mix); animation:pulse 1s infinite; }
.dot.bad { background:#ef7a6c; }

/* Buttons */
.btn { background:var(--accent); color:#fff; border:0; padding:8px 18px; border-radius:8px; font-weight:700; cursor:pointer; font-size:13px; }
.btn:hover { background:#5a3e2b; }
.btn:disabled { opacity:.6; cursor:default; }
.btn.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
.btn.ghost:hover { background:var(--panel2); }
.btn.small { padding:5px 12px; }
.topbar .btn { background:var(--cream); color:var(--brown-dark); }
.topbar .btn:hover { background:#fff; }

/* Filters */
.filters { display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px; background:var(--panel); border:1px solid var(--line);
  border-radius:14px; padding:12px 16px; margin-bottom:14px; box-shadow:var(--shadow); }
.pills { display:flex; gap:6px; flex-wrap:wrap; }
.pill { background:var(--panel2); color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:7px 15px; cursor:pointer; font-size:13px; }
.pill:hover { border-color:var(--accent); color:var(--accent); }
.pill.active { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; }
.select-wrap { display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
.select-wrap select { background:#fff; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; min-width:160px; }
.select-wrap select:focus { outline:2px solid var(--accent2); }

/* Banners and empty state */
.banner { display:flex; align-items:center; justify-content:space-between; gap:12px; border-radius:10px; padding:10px 14px; margin-bottom:14px; }
.banner.error { background:#fbeae7; border:1px solid #e6b8b0; color:#8a2f24; }
.empty { text-align:center; background:var(--panel); border:1px dashed var(--latte); border-radius:14px; padding:50px 20px; margin-bottom:14px; }
.empty-title { font-family:var(--serif); font-size:20px; font-weight:700; }
.empty-sub { color:var(--muted); margin:6px 0 16px; }

/* KPI cards */
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
.kpi { background:var(--panel); border:1px solid var(--line); border-top:4px solid var(--latte); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); }
.kpi .label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.8px; }
.kpi .value { font-family:var(--serif); font-size:32px; font-weight:700; margin:6px 0 2px; color:var(--brown-dark); }
.kpi .delta { font-size:12px; color:var(--muted); min-height:17px; }
.delta.good { color:var(--pos); } .delta.bad { color:var(--neg); } .delta.flat { color:var(--muted); }
.value.pos { color:var(--pos) !important; } .value.neg { color:var(--neg) !important; } .value.mix { color:#b8860b !important; }

/* Cards and grid */
.grid { display:grid; grid-template-columns:repeat(12,1fr); gap:14px; margin-top:14px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; min-width:0; box-shadow:var(--shadow); }
.card h2 { margin:0 0 14px; padding-bottom:8px; border-bottom:1px dashed var(--line);
  font-family:var(--serif); font-size:17px; font-weight:700; color:var(--brown-dark); }
.card h2::before { content:""; display:inline-block; width:8px; height:12px; border-radius:50%; background:var(--accent);
  transform:rotate(-30deg); margin-right:9px; vertical-align:-1px; }
.card-body { min-height:200px; }
.placeholder { height:200px; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 16px; color:var(--muted);
  border:1px dashed var(--line); border-radius:10px; font-size:13px; background:var(--bg); }
.span-4 { grid-column:span 4; } .span-6 { grid-column:span 6; } .span-8 { grid-column:span 8; } .span-12 { grid-column:span 12; }

.foot { text-align:center; color:var(--muted); font-family:var(--serif); font-style:italic; font-size:13px; margin-top:30px; }

/* Loading shimmer */
body.first-load .kpi .value { color:transparent !important; width:60%; border-radius:6px;
  background:linear-gradient(90deg,var(--panel2),var(--line),var(--panel2)); background-size:200% 100%; animation:shimmer 1.2s infinite; }

@keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }

@media (max-width:900px) {
  .span-4, .span-6, .span-8 { grid-column:span 12; }
  .select-wrap select { min-width:130px; }
}
@media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
</style>

<style>
.filter-group { display:flex; flex-direction:column; gap:3px; }
.filter-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
.custom-range .range-inputs { display:flex; align-items:center; gap:6px; flex-wrap:wrap; text-transform:none; letter-spacing:0; }
.custom-range input[type=date] { background:#fff; color:var(--text); border:1px solid var(--line); border-radius:8px;
  padding:6px 8px; font-size:13px; font-family:inherit; }
.custom-range input[type=date]:focus { outline:2px solid var(--accent2); }
.custom-range .to { color:var(--muted); font-size:13px; }
.period-line { margin:-4px 4px 14px; color:var(--muted); font-size:13px; }
.period-line b { color:var(--brown-dark); font-family:var(--serif); font-size:16px; }
.period-line.warn { color:var(--neg); font-weight:700; }
</style>
